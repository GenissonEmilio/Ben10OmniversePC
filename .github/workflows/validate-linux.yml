name: Validate Linux native foundation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install manufactured-disc test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y genisoimage
      - name: Apply reviewed runtime fixes
        run: python3 tools/apply_runtime_patches.py
      - name: Build Linux toolchain
        run: docker build -t ben10-omniverse-tools:local -f docker/Dockerfile .
      - name: Build and test runtime without game data
        run: scripts/test-linux.sh
