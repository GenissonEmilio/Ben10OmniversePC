name: Validate Linux native foundation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Import regressions (manufactured discs only)
        run: |
          sudo apt-get update
          sudo apt-get install -y genisoimage
          python3 -m unittest discover -s tests -v
      - name: Apply reviewed runtime fixes
        run: python3 tools/apply_runtime_patches.py
      - name: Build Linux toolchain
        run: docker build -t ben10-omniverse-tools:local -f docker/Dockerfile .
      - name: Build and test runtime without game data
        run: |
          mkdir -p build/ci
          docker run --rm --cpus=2 --memory=4g --memory-swap=4g --network=none \
            --user "$(id -u):$(id -g)" --cap-drop=ALL --security-opt=no-new-privileges \
            -e HOME=/tmp -v "$PWD:/workspace" -w /workspace ben10-omniverse-tools:local bash -c '
              set -euo pipefail
              cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DBEN10_BUILD_GAME=OFF -DPS3RECOMP_BUILD_TESTS=ON
              cmake --build build/ci --parallel 2
              ctest --test-dir build/ci --output-on-failure --timeout 60 -j 1
              python3 third_party/ps3recomp/tools/test_gcm_flip_stream.py
              python3 third_party/ps3recomp/tools/test_spurs_scheduler.py
            '
